<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionAttend - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center px-4">
    <main class="w-full max-w-md bg-white rounded-xl shadow-xl p-8">
        <h1 class="text-2xl font-bold text-slate-900">VisionAttend Admin</h1>
        <p class="mt-2 text-sm text-slate-500">Sign in to manage students and attendance.</p>
        {% if error %}
        <div class="mt-5 rounded-lg bg-rose-50 border border-rose-200 px-4 py-3 text-sm text-rose-700">{{ error }}</div>
        {% endif %}
        <form action="/login" method="post" class="mt-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input name="username" type="text" autocomplete="username" required class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input name="password" type="password" autocomplete="current-password" required class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full rounded-lg bg-indigo-600 py-2.5 text-white font-semibold hover:bg-indigo-700">Sign in</button>
        </form>
    </main>
</body>
</html>
